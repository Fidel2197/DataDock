stages: [test, build, publish, deploy]
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

python-tests:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: datadock_test
    POSTGRES_USER: datadock
    POSTGRES_PASSWORD: test_only_ci_password
    TEST_DATABASE_URL: postgresql+psycopg://datadock:test_only_ci_password@postgres:5432/datadock_test
  script:
    - pip install -r backend/requirements.txt
    - cd backend
    - ruff check .
    - ruff format --check .
    - pytest

frontend-build:
  stage: build
  image: node:24-alpine
  script:
    - cd frontend
    - npm ci
    - npm run test
    - npm run build
  artifacts:
    paths: [frontend/dist/]
    expire_in: 7 days

containers:
  stage: publish
  image: docker:28-cli
  services: [docker:28-dind]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA" backend
    - docker build -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA" -f frontend/Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-production:
  stage: deploy
  image: python:3.12-slim
  id_tokens:
    AWS_ID_TOKEN:
      aud: sts.amazonaws.com
  environment:
    name: production
    url: $PRODUCTION_URL
  script:
    - pip install boto3
    - python deploy/gitlab_deploy.py
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  resource_group: production
