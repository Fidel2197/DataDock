name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: datadock_test
          POSTGRES_USER: datadock
          POSTGRES_PASSWORD: test_only_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U datadock -d datadock_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://datadock:test_only_ci_password@localhost:5432/datadock_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python -m ruff check . && python -m ruff format --check . && python -m pytest
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run test && npm run build
        working-directory: frontend
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t datadock-api backend
      - run: docker build -t datadock-web -f frontend/Dockerfile .
